<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card__front">
            <picture class="card__worker">
                <source srcset="dalto_small.png" media="(max-width: 600px)">
                <img src="dalto.png" alt="imagen de dalto">
            </picture>
            <div class="card__data">
                <span>Lucas Dalto</span>
                <p>
                    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quos unde consequatur nemo enim porro, nam officiis natus illum perspiciatis odio! Minus sapiente eveniet tempore quisquam saepe fugiat vero repellat ex.
                </p>
            </div>
        </div>
        <div class="card__back">
            <span>Skills</span>
            <div class="skills__bar">
                <div class="HTML"> HTML </div>
            </div>

            <div class="skills__bar ">
                <div class="JAVAS"> JAVASCRIPT </div>
            </div>

            <div class="skills__bar ">
                <div class="PY"> PYTHON </div>
            </div>

            <div class="skills__bar">
                <div class="SQL"> SQL </div>
            </div>
        </div>
    </div>
</body>
</html>
