<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTAREA</title>
    <link rel="stylesheet" href="styles_2.css">
    <link rel="icon" href="david.png" type="image/png">
</head>
<body>
    <form>
        <h2> formulario de respuesta </h2>
        <div class="form_input">
            <input type="text" placeholder="nombre de usuario">
        </div>
        <div class="form_input">
            <input type="email" placeholder="email">
        </div>
        <div class="form_input">
            <!--el textarea es como un elemento mas, abre y cierrra la etiqueta-->
            <textarea rows="7" maxlength="400" placeholder="deja tu mensaje"></textarea>
        </div>
    </form>
</body>
</html>
